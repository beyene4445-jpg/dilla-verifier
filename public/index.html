<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dilla University Verifier</title>
  <meta name="theme-color" content="#020617" />
  <link rel="manifest" href="/manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Dilla University</h1>
      <p>Verification System</p>
    </div>

    <div class="nav-grid">
      <a class="nav-card" href="/signin">
        <div class="emoji">🪪</div>
        <div class="label">Sign in with Fayda</div>
        <div class="desc">Verify via National ID</div>
      </a>
      <a class="nav-card" href="/cafeteria">
        <div class="emoji">🍽️</div>
        <div class="label">Cafeteria</div>
        <div class="desc">Face verification for meals</div>
      </a>
      <a class="nav-card" href="/register">
        <div class="emoji">📝</div>
        <div class="label">Registration</div>
        <div class="desc">Register with Fayda QR</div>
      </a>
      <a class="nav-card" href="/admin">
        <div class="emoji">📊</div>
        <div class="label">Admin</div>
        <div class="desc">Dashboard</div>
      </a>
    </div>

    <p class="hint">Dilla University · 2026</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
