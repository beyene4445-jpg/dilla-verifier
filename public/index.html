<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dilla University Verifier</title>
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dilla Verifier" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjM4IiBmaWxsPSIjMGYxNzJhIi8+PHRleHQgeD0iOTYiIHk9IjEyMCIgZm9udC1zaXplPSI4MCIgZm9udC13ZWlnaHQ9ImJvbGQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMxMGI5ODEiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIj5EVTwvdGV4dD48L3N2Zz4=" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Dilla University</h1>
      <p>Verification System</p>
    </div>

    <!-- Install Banner -->
    <div id="installBanner" style="display: none; background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(6,182,212,0.1)); border: 1px solid var(--accent); border-radius: 16px; padding: 16px; margin-bottom: 20px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
        <div style="font-size: 32px;">📱</div>
        <div style="flex: 1;">
          <div style="font-weight: 700; font-size: 14px;">Install as App</div>
          <div style="font-size: 12px; color: var(--text-2);">Works offline · Faster · Home screen icon</div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="installPWA()" style="padding: 12px;">
        📥 Install Now
      </button>
    </div>

    <div class="nav-grid">
      <a class="nav-card" href="/signin">
        <div class="emoji">🪪</div>
        <div class="label">Sign in with Fayda</div>
        <div class="desc">Verify via FAN</div>
      </a>
      <a class="nav-card" href="/cafeteria">
        <div class="emoji">🍽️</div>
        <div class="label">Cafeteria</div>
        <div class="desc">Fast face verify</div>
      </a>
      <a class="nav-card" href="/register">
        <div class="emoji">📝</div>
        <div class="label">Registration</div>
        <div class="desc">New member sign-up</div>
      </a>
      <a class="nav-card" href="/admin">
        <div class="emoji">📊</div>
        <div class="label">Admin</div>
        <div class="desc">Dashboard</div>
      </a>
    </div>

    <p class="hint">Dilla University · 2026</p>
  </div>

  <script>
    let deferredPrompt = null;

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').style.display = 'block';
    });

    window.installPWA = async function() {
      if (!deferredPrompt) {
        alert('To install:\n\nAndroid: Tap menu (⋮) → "Install app" or "Add to Home screen"\niPhone: Tap Share → "Add to Home Screen"');
        return;
      }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      console.log('Install choice:', choice.outcome);
      deferredPrompt = null;
      document.getElementById('installBanner').style.display = 'none';
    };

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ SW registered:', reg.scope))
        .catch(err => console.error('SW error:', err));
    }

    // Check if already installed
    window.addEventListener('appinstalled', () => {
      console.log('✅ PWA installed');
      document.getElementById('installBanner').style.display = 'none';
    });
  </script>
</body>
</html>
