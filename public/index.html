<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />

  <title>Dilla University Verifier</title>
  <meta name="theme-color" content="#020617" />
  <link rel="manifest" href="/manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Dilla University</h1>
      <p>የFayda QR እና የፊት ማረጋገጫ ስርዓት</p>
    </div>

    <div class="nav-grid">
      <a class="nav-card" href="/gateway">
        <div class="emoji">🚪</div>
        <div class="label">የበር ማረጋገጫ</div>
        <div class="desc">QR Scan</div>
      </a>
      <a class="nav-card" href="/verify-face?mode=gate">
        <div class="emoji">📷</div>
        <div class="label">የፊት ማረጋገጫ</div>

      </a>

        <div class="emoji">📊</div>
        <div class="label">Admin</div>
        <div class="desc">Dashboard</div>
      </a>
    </div>

    <p class="hint">Dilla University · 2026</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
