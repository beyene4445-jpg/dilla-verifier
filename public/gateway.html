<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gateway · Dilla Verifier</title>
  <meta name="theme-color" content="#020617" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚪 የበር ማረጋገጫ</h1>
      <p>የFayda QR ኮድ ወደ ካሜራው አቅርብ</p>
    </div>

    <div class="card" style="padding: 12px;"><div id="reader"></div></div>
    <div id="status" class="status hidden"></div>

    <div style="display: flex; gap: 10px; margin-top: 16px;">
      <button class="btn btn-ghost btn-block" onclick="window.location.href='/'">← ተመለስ</button>
      <button class="btn btn-ghost btn-block" id="toggleBtn">⏸ አቁም</button>
    </div>
    <p class="hint">ስካኑ በራስ-ሰር ይሰራል</p>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { ui } from '/js/ui.js';
    import { QRScanner } from '/js/scanner.js';

    let processing = false;
    const scanner = new QRScanner('reader', async (raw) => {
      if (processing) return;
      processing = true;
      await scanner.pause();

      try {
        const result = await api.verify(raw, 'gate', { gate: 'main' });

        if (result.allowed) {
          ui.showStatus('ok', '✅', 'Get In!', 'የዲላ ዩኒቨርሲቲ ተማሪ ነው', result.student?.name || '');
          ui.beep(true);
          ui.speak('Get in');
        } else {
          const titles = {
            not_registered: ['🚫', 'Not Allowed', 'Please talk to security guard'],
            not_approved: ['⏳', 'Not Approved', 'Admin አላጸደቀም'],
            invalid_qr: ['❓', 'Invalid QR', 'QR ሊነበብ አልቻለም'],
          };
          const [icon, title, sub] = titles[result.reason] || ['🚫', 'Not Allowed', result.message || ''];
          ui.showStatus('err', icon, title, sub, result.student?.name || '');
          ui.beep(false);
          ui.speak('Not allowed');
        }
      } catch (e) {
        ui.showStatus('err', '⚠️', 'Network Error', 'ኢንተርኔት አልተገኘም');
        ui.beep(false);
      }

      setTimeout(async () => {
        processing = false;
        try { await scanner.resume(); } catch {}
      }, 3000);
    });

    scanner.start().catch(err => {
      ui.showStatus('err', '📷', 'Camera Error', 'ካሜራ ሊከፈት አልቻለም — HTTPS ያስፈልጋል');
    });

    let paused = false;
    document.getElementById('toggleBtn').addEventListener('click', async (e) => {
      if (paused) { await scanner.resume(); e.target.textContent = '⏸ አቁም'; }
      else { await scanner.pause(); e.target.textContent = '▶ ቀጥል'; }
      paused = !paused;
    });
  </script>
</body>
</html>
