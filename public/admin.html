<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin · Dilla Verifier</title>
  <meta name="theme-color" content="#020617" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Admin Dashboard</h1>
      <p>Dilla University Verifier</p>
    </div>

    <div class="card" id="loginCard">
      <label style="display:block; margin-bottom: 6px; font-size: 13px; color: var(--text-2);">Admin Key</label>
      <input class="input" type="password" id="adminKey" placeholder="Admin key..." />
      <button class="btn btn-primary btn-block" style="margin-top: 12px;" onclick="loadStats()">Sign In</button>
    </div>

    <div id="dashboard" style="display: none;">
      <div class="nav-grid" style="grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 20px;">
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #06b6d4;" id="s-total">–</div>
          <div style="font-size: 11px; color: var(--text-2);">Total</div>
        </div>
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #10b981;" id="s-active">–</div>
          <div style="font-size: 11px; color: var(--text-2);">Active</div>
        </div>
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #f59e0b;" id="s-pending">–</div>
          <div style="font-size: 11px; color: var(--text-2);">Pending</div>
        </div>
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #ef4444;" id="s-rejected">–</div>
          <div style="font-size: 11px; color: var(--text-2);">Rejected</div>
        </div>
      </div>

      <button class="btn btn-primary btn-block" onclick="autoVerify()" style="padding: 16px; margin-bottom: 20px; background: linear-gradient(135deg, #06b6d4, #10b981);">
        ⚡ Auto-Verify Pending (Match with DU Data)
      </button>

      <div id="autoVerifyResult" style="display: none; margin-bottom: 20px;"></div>

      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 16px;">⏳ Pending Approvals (<span id="pendingCount">0</span>)</h3>
        <div id="pendingList"></div>
      </div>

      <button class="btn btn-ghost btn-block" onclick="loadStats()">🔄 Refresh</button>
    </div>

    <p class="hint"><a href="/" style="color: var(--accent);">← Back to Home</a></p>
  </div>

  <script>
    let adminKey = '';

    async function loadStats() {
      adminKey = document.getElementById('adminKey').value.trim() || localStorage.getItem('adminKey');
      if (!adminKey) return alert('Admin key required');
      localStorage.setItem('adminKey', adminKey);

      try {
        const [statsRes, pendingRes] = await Promise.all([
          fetch(`/api/stats?key=${encodeURIComponent(adminKey)}`),
          fetch(`/api/admin/pending?key=${encodeURIComponent(adminKey)}`),
        ]);

        if (!statsRes.ok) throw new Error('Unauthorized');

        const stats = await statsRes.json();
        const pendingData = await pendingRes.json();

        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        document.getElementById('s-total').textContent = stats.total;
        document.getElementById('s-active').textContent = stats.active;
        document.getElementById('s-pending').textContent = stats.pending;
        document.getElementById('s-rejected').textContent = stats.rejected;
        document.getElementById('pendingCount').textContent = stats.pending;

        renderPending(pendingData.pending || []);
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function renderPending(list) {
      const el = document.getElementById('pendingList');
      if (!list.length) {
        el.innerHTML = '<div style="text-align: center; color: var(--text-2); padding: 20px;">✅ No pending approvals</div>';
        return;
      }

      el.innerHTML = list.map(p => `
        <div style="padding: 14px; border-bottom: 1px solid var(--border);">
          <div style="display: flex; gap: 8px; align-items: flex-start;">
            <div style="flex: 1; min-width: 0;">
              <div style="font-weight: 700; font-size: 15px; margin-bottom: 4px;">${p.name || '—'}</div>
              <div style="font-size: 12px; color: var(--text-2); line-height: 1.5;">
                <div>FAN: ${p.fan || '—'} · FIN: ${p.fin || '—'}</div>
                <div>📱 ${p.phone || '—'} · 🗺️ ${p.region || '—'}</div>
                <div>🎓 ${p.userType || '—'} · ${p.college || '—'}</div>
                ${p.universityId ? `<div>ID: ${p.universityId}</div>` : ''}
              </div>
              ${p.nationalIdUrl ? `<a href="${p.nationalIdUrl}" target="_blank" style="font-size: 11px; color: var(--accent); display: inline-block; margin-top: 6px;">📷 View National ID</a>` : ''}
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <button class="btn btn-primary" style="padding: 8px 14px; font-size: 13px;" onclick="approve(${p.rowIndex})">✓ Approve</button>
              <button class="btn btn-ghost" style="padding: 8px 14px; font-size: 13px;" onclick="reject(${p.rowIndex})">✕ Reject</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function approve(rowIndex) {
      await fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: adminKey, rowIndex, decision: 'approve' }),
      });
      loadStats();
    }

    async function reject(rowIndex) {
      if (!confirm('Reject this registration?')) return;
      await fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: adminKey, rowIndex, decision: 'reject' }),
      });
      loadStats();
    }

    async function autoVerify() {
      if (!confirm('Auto-verify all pending registrations against DU_Reference data?')) return;

      const el = document.getElementById('autoVerifyResult');
      el.style.display = 'block';
      el.innerHTML = '<div class="card" style="text-align: center;">⏳ Running auto-verification...</div>';

      try {
        const res = await fetch('/api/admin/auto-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: adminKey }),
        });
        const data = await res.json();

        if (data.ok) {
          el.innerHTML = `
            <div class="card" style="background: rgba(16,185,129,0.1); border: 1px solid var(--accent);">
              <div style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">⚡ Auto-Verification Complete</div>
              <div style="font-size: 13px; color: var(--text-1); line-height: 1.8;">
                ✅ Approved: <b>${data.approved}</b><br>
                ❌ Rejected: <b>${data.rejected}</b><br>
                📊 Total: <b>${data.total}</b>
              </div>
            </div>
          `;
          setTimeout(() => loadStats(), 1500);
        } else {
          el.innerHTML = `<div class="card" style="background: rgba(239,68,68,0.1); border: 1px solid var(--danger);">
            <div style="color: #fca5a5;">❌ ${data.message || 'Auto-verify failed'}</div>
          </div>`;
        }
      } catch (e) {
        el.innerHTML = `<div class="card" style="background: rgba(239,68,68,0.1); border: 1px solid var(--danger);">
          <div style="color: #fca5a5;">❌ Error: ${e.message}</div>
        </div>`;
      }
    }

    const saved = localStorage.getItem('adminKey');
    if (saved) {
      document.getElementById('adminKey').value = saved;
      loadStats();
    }
  </script>
</body>
</html>
