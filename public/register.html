<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin · Dilla Verifier</title>
  <meta name="theme-color" content="#020617" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 የአስተዳዳሪ ዳሽቦርድ</h1>
      <p>Dilla University</p>
    </div>

    <div class="card" id="loginCard">
      <label class="lbl">የAdmin ቁልፍ</label>
      <input class="input" type="password" id="adminKey" placeholder="Admin key..." />
      <button class="btn btn-primary btn-block" style="margin-top: 12px;" onclick="loadStats()">ግባ</button>
    </div>

    <div id="dashboard" style="display: none;">
      <div class="nav-grid" style="grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 20px;">
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #06b6d4;" id="s-total">–</div>
          <div style="font-size: 11px; color: var(--text-2);">ጠቅላላ</div>
        </div>
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #10b981;" id="s-active">–</div>
          <div style="font-size: 11px; color: var(--text-2);">የተፈቀዱ</div>
        </div>
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #f59e0b;" id="s-pending">–</div>
          <div style="font-size: 11px; color: var(--text-2);">በመጠበቅ</div>
        </div>
        <div class="card" style="text-align: center; padding: 16px;">
          <div style="font-size: 28px; font-weight: 800; color: #ef4444;" id="s-rejected">–</div>
          <div style="font-size: 11px; color: var(--text-2);">የተከለከሉ</div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 12px;">⏳ በመጠበቅ ላይ</h3>
        <div id="pendingList"></div>
      </div>

      <button class="btn btn-ghost btn-block" onclick="loadStats()">🔄 አድስ</button>
    </div>

    <p class="hint"><a href="/" style="color: var(--accent);">← ተመለስ</a></p>
  </div>

  <script>
    let adminKey = '';

    async function loadStats() {
      adminKey = document.getElementById('adminKey').value.trim() || localStorage.getItem('adminKey');
      if (!adminKey) return alert('የAdmin ቁልፍ ያስፈልጋል');
      localStorage.setItem('adminKey', adminKey);

      try {
        const [statsRes, pendingRes] = await Promise.all([
          fetch(`/api/stats?key=${encodeURIComponent(adminKey)}`),
          fetch(`/api/admin/pending?key=${encodeURIComponent(adminKey)}`),
        ]);

        if (!statsRes.ok) throw new Error('Unauthorized');

        const stats = await statsRes.json();
        const pendingData = await pendingRes.json();

        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        document.getElementById('s-total').textContent = stats.total;
        document.getElementById('s-active').textContent = stats.active;
        document.getElementById('s-pending').textContent = stats.pending;
        document.getElementById('s-rejected').textContent = stats.rejected;

        const pendingList = document.getElementById('pendingList');
        if (pendingData.pending && pendingData.pending.length) {
          pendingList.innerHTML = pendingData.pending.map(p => `
            <div style="padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center;">
              <div style="flex: 1;">
                <div style="font-weight: 600; font-size: 14px;">${p.name || '—'}</div>
                <div style="font-size: 11px; color: var(--text-2); margin-top: 4px;">
                  ${p.userType || ''} · ${p.phone || ''}
                </div>
              </div>
              <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="approve(${p.rowIndex})">✓</button>
              <button class="btn btn-ghost" style="padding: 6px 12px; font-size: 12px;" onclick="reject(${p.rowIndex})">✕</button>
            </div>
          `).join('');
        } else {
          pendingList.innerHTML = '<div style="text-align: center; color: var(--text-2); padding: 20px;">✅ ሁሉም ተረጋግጧል</div>';
        }
      } catch (e) {
        alert('ስህተት: ' + e.message);
      }
    }

    async function approve(rowIndex) {
      await fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: adminKey, rowIndex, decision: 'approve' }),
      });
      loadStats();
    }

    async function reject(rowIndex) {
      if (!confirm('ማስቀረት ትፈልጋለህ?')) return;
      await fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: adminKey, rowIndex, decision: 'reject' }),
      });
      loadStats();
    }

    const saved = localStorage.getItem('adminKey');
    if (saved) { document.getElementById('adminKey').value = saved; loadStats(); }
  </script>
</body>
</html>
